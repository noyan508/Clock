<!DOCTYPE html>

<html>
<head>
  <meta name="viewport" content="width=device-width,
    initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <link rel="styleSheet" href="clock.css"/>
  <title>my clock</title>
  <style>
  </style>
</head>
<body>
 
  
  <div id="box" class="box">
    
    <div class="num n1"><span>1</span></div>
    <div class="num n2"><span>2</span></div>
    <div class="num n3"><span>3</span></div>
    <div class="num n4"><span>4</span></div>
    <div class="num n5"><span>5</span></div>
    <div class="num n6"><span>6</span></div>
    <div class="num n7"><span>7</span></div>
    <div class="num n8"><span>8</span></div>
    <div class="num n9"><span>9</span></div>
    <div class="num n10"><span>10</span></div>
    <div class="num n11"><span>11</span></div>
    <div class="num n12"><span>12</span></div>
    <div id="hand" class="win"></div>
    <div id="minute" class="win2"></div>
    <div id="hour" class="win3"></div>
    <div class="center-pin"></div>
    <div id="tyme">
      <span class="tyme1" id="digit">00 00</span>
      <span class="tyme2" id="ampm"></span>
      </div>
    <div class="bit">:</div>
  </div>
  
  
  
  
  <script src="clock.js"></script>
</body>
</html>
